# اجرای Ollama با Docker — گزینه جایگزین نصب بومی
#
# اجرا:
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen3:8b
#   curl http://localhost:11434/api/tags
#
# توجه: روی Windows Server، Docker Desktop خودش ۱ تا ۲ گیگابایت RAM مصرف می‌کند.
# اگر RAM آزاد محدود است، نصب بومی (scripts/setup-ollama.ps1) توصیه می‌شود.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1        # مدل همیشه در RAM بماند
      - OLLAMA_NUM_PARALLEL=1       # یک درخواست همزمان (صرفه‌جویی RAM روی CPU)
      - OLLAMA_FLASH_ATTENTION=1    # کاهش مصرف RAM کش
      - OLLAMA_KV_CACHE_TYPE=q8_0   # کوانتیزه کردن حافظه KV
    restart: unless-stopped

volumes:
  ollama_data:
